<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <section class="page-header">
      <h1 class="project-name">{{ site.header_title | default: site.title | default: site.github.repository_name }}</h1>
      {% if site.description %}
      <h2 class="project-tagline">{{ site.description }}</h2>
      {% endif %}
    </section>

    <section class="main-content">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-owner">{{ site.footer_text | default: "Maintained by Seventh Fleet." }}</span>
      </footer>
    </section>
  </body>
</html>
